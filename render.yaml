# Render manifest template - adjust fields as needed after connecting your repo
services:
  - type: web
    name: datos-sensibles
    env: python
    plan: free
    region: oregon
    buildCommand: >
      pip install -r requirements.txt && 
      python scripts/fetch_db_from_s3.py s3://sesible-data-story-db-carlos/data.db || true && 
      python build_db.py || true
    startCommand: "gunicorn api:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: AUTH_USER
        value: Storytelling
      - key: AUTH_PASSWORD
        value: DatosSensibles2025$
      - key: FLASK_SECRET
        value: change-me-in-production
    # If you have a paid Render plan with a persistent disk, uncomment and
    # set the mount path above, then set DATA_DIRECTORY in envVars to that path.

# Notes: The `buildCommand` runs the DB build if CSVs are present. If you prefer to
# keep CSV files outside of your repository, upload them to the service's disk or use
# object storage (S3) and adjust `build_db.py` accordingly.